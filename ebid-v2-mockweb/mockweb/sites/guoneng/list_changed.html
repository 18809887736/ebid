<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>{{ catname }}</title></head>
<body>
<!-- layout_changed: 改版后的 DOM —— 无 title 属性、无 ymd 路径、链接换成 ?id= 形式 -->
<div class="notice-board" data-category="{{ cat }}">
  {% for r in rows %}
  <div class="notice-cell">
    <span class="cell-title">{{ r.title }}</span>
    <em class="cell-date">{{ r.date_s }}</em>
    <a class="cell-link" href="/guoneng/view/detail?id={{ r.slug }}">查看</a>
  </div>
  {% else %}
  <div class="notice-empty">没有符合条件的记录</div>
  {% endfor %}
</div>
</body>
</html>
