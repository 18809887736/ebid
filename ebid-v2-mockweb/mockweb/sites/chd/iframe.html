<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>公告列表</title></head>
<body>
<!-- 真站 iframe 异步出数据：行由下面脚本延迟注入，用来测 waitFor* 替代固定 sleep -->
<table class="gglist" id="gglist">
  <thead><tr><th>状态</th><th>公告标题</th><th>采购方式</th><th>发布时间</th></tr></thead>
  <tbody></tbody>
</table>
<script>
var rows = {{ rows_json | safe }};
setTimeout(function () {
  var tb = document.querySelector("#gglist tbody");
  rows.forEach(function (r) {
    var tr = document.createElement("tr");
    tr.innerHTML = "<td>" + r.status + "</td>" +
      "<td><a href=\"javascript:void(0)\" onclick=\"winOpenDetail('" + r.onclick_id + "')\">" + r.title + "</a></td>" +
      "<td>" + r.type + "</td><td>[" + r.date + "]</td>";
    tb.appendChild(tr);
  });
}, 500);
</script>
</body>
</html>
